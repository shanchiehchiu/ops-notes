<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c10">
  <title>{{ page.title }} | {{ site.description }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c10'/%3E%3Cpath d='M8 11l6 5-6 5' fill='none' stroke='%233dff8f' stroke-width='3'/%3E%3Cpath d='M17 22h8' stroke='%233dff8f' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <aside class="toc" id="toc" aria-label="大綱"></aside>
  <main class="wrap">
    {% if page.url != '/' %}
    <a class="back" href="{{ '/' | relative_url }}">← 回到維運筆記</a>
    {% endif %}
    {{ content }}
  </main>
  <footer class="wrap foot">
    <a href="https://github.com/shanchiehchiu/ops-notes">在 GitHub 查看原始碼</a>
  </footer>
  <script>
  (function () {
    var toc = document.getElementById('toc');
    var heads = document.querySelectorAll('main h2, main h3');
    if (heads.length < 3) { toc.remove(); return; }

    var title = document.createElement('div');
    title.className = 'toc-title';
    title.textContent = '大綱';
    toc.appendChild(title);

    var ul = document.createElement('ul');
    heads.forEach(function (h, i) {
      if (!h.id) { h.id = 'sec-' + i; }
      var li = document.createElement('li');
      if (h.tagName === 'H3') { li.className = 'toc-sub'; }
      var a = document.createElement('a');
      a.href = '#' + h.id;
      a.textContent = h.textContent;
      li.appendChild(a);
      ul.appendChild(li);
    });
    toc.appendChild(ul);

    var links = Array.prototype.slice.call(ul.querySelectorAll('a'));
    var current = null;
    function spy() {
      var active = heads[0];
      heads.forEach(function (h) {
        if (h.getBoundingClientRect().top <= 100) { active = h; }
      });
      if (active === current) { return; }
      current = active;
      links.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + active.id);
      });
    }
    document.addEventListener('scroll', spy, { passive: true });
    spy();
  })();
  </script>
</body>
</html>
