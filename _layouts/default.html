<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0c10">
  <title>{{ page.title }} | {{ site.description }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0c10'/%3E%3Cpath d='M8 11l6 5-6 5' fill='none' stroke='%233dff8f' stroke-width='3'/%3E%3Cpath d='M17 22h8' stroke='%233dff8f' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="page">
    <nav class="toc-rail" id="toc" aria-label="大綱"><span class="toc-title">大綱</span><ol></ol></nav>
    <main class="wrap">
      {% if page.url != '/' %}
      <a class="back" href="{{ '/' | relative_url }}">← 回到維運筆記</a>
      {% endif %}
      {{ content }}
    </main>
  </div>
  <footer class="wrap foot">
    <a href="https://github.com/shanchiehchiu/ops-notes">在 GitHub 查看原始碼</a>
  </footer>
  <script>
  // 大綱：抓 h2/h3 產生左側欄（寬螢幕）與頁首收合清單（窄螢幕），附捲動高亮
  (function () {
    var main = document.querySelector('main');
    var rail = document.getElementById('toc');
    var heads = Array.prototype.slice.call(main.querySelectorAll('h2, h3'));
    if (heads.length < 3) { return; }
    document.body.classList.add('has-toc');

    // 窄螢幕用的頁首收合目錄，插在 h1/byline 之後
    var top = document.createElement('details');
    top.className = 'toc-top';
    var sum = document.createElement('summary');
    sum.textContent = '大綱';
    top.appendChild(sum);
    var topList = document.createElement('ol');
    top.appendChild(topList);
    var anchor = main.querySelector('.byline') || main.querySelector('h1') || main.firstChild;
    anchor.parentNode.insertBefore(top, anchor.nextSibling);

    var railList = rail.querySelector('ol');
    heads.forEach(function (h, i) {
      if (!h.id) { h.id = 'sec-' + i; }
      [railList, topList].forEach(function (list) {
        var li = document.createElement('li');
        if (h.tagName === 'H3') { li.className = 'toc-sub'; }
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        li.appendChild(a);
        list.appendChild(li);
      });
    });

    var links = Array.prototype.slice.call(railList.querySelectorAll('a'));
    var current = null;
    function spy() {
      var active = heads[0];
      heads.forEach(function (h) {
        if (h.getBoundingClientRect().top <= 100) { active = h; }
      });
      if (active === current) { return; }
      current = active;
      links.forEach(function (a) {
        a.classList.toggle('active', a.getAttribute('href') === '#' + active.id);
      });
    }
    document.addEventListener('scroll', spy, { passive: true });
    spy();
  })();
  </script>
</body>
</html>
